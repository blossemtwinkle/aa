<h1>Good Plan Better Life Weekly Planner</h1>


<table id="timetable">
    <tr>
        <th>Time</th>
        <th>Monday</th>

</table>

    Save Schedule
</button>

<!--Javascript code for schedule container class-->
<script>
const table = document.getElementById("timetable");


for (let hour = 8; hour <= 17; hour++) {


    let row = table.insertRow();


    let timeCell = row.insertCell();


    timeCell.innerText = `${hour}:00`;


    for (let day = 0; day < 5; day++) {


        let cell = row.insertCell();


        let input = document.createElement("input");


        input.placeholder = "Type here";


        cell.appendChild(input);
    }
}




</script>


<script>
    document.getElementById("saveBtn")
.addEventListener("click", saveSchedule);


function saveSchedule() {


    let schedule = [];


    let rows = table.rows;


    for (let i = 1; i < rows.length; i++) {


        let time = rows[i].cells[0].innerText;


        for (let j = 1; j <= 5; j++) {


            let text =
                rows[i]
                .cells[j]
                .querySelector("input")
                .value;


            if (text !== "") {


                schedule.push({
                    day: j,
                    time: time,
                    task: text
                });
            }
        }
    }


    localStorage.setItem(
        "schedule",
        JSON.stringify(schedule)
    );


    alert("Schedule Saved!");
}
</script>


<script>
    setInterval(checkReminder, 60000);


function checkReminder() {


    let data =
        JSON.parse(
            localStorage.getItem("schedule")
        ) || [];


    let now = new Date();


    let day = now.getDay();


    let hour = now.getHours();


    let currentTime = `${hour}:00`;


    data.forEach(item => {


        if (
            item.day === day &&
            item.time === currentTime
        ) {
            alert(
                "Reminder: " +
                item.task
            );
        }
    });
}
</script>

<script>
let timeout;

window.addEventListener("scroll", () => {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
        // FIXED: Corrected the quotation marks and separated the key and value
        localStorage.setItem("scrollY", window.scrollY);
    }, 200);
});

// FIXED: Corrected the arrow function syntax ()> to () =>
window.addEventListener("load", () => {
    // FIXED: Changed scrollY to savedY in the if-statement to check the retrieved value
    const savedY = localStorage.getItem("scrollY");
    if (savedY !== null) {
        // FIXED: Corrected window.scrollTp to window.scrollTo
        window.scrollTo(0, parseInt(savedY));
    }
});

</script>
