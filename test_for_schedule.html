<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <style>
        /* Base Reset & Layout styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            padding: 40px;
        }

        /* Enlarged Container - increased width and padding */
        .schedule-container {
            width: 750px; /* Increased from 450px */
            background-color: #f3e8ff; 
            border: 3px solid #c084fc; /* Thicker borders for scaling */
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* Enlarged Header block */
        .schedule-header {
            background-color: #fde047; 
            border: 3px solid #eab308;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            font-size: 24px; /* Increased text size */
            color: #334155;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* Expanded Inner workspace layout grid */
        .schedule-workspace {
            display: grid;
            grid-template-columns: 160px 1fr; /* Widened the left menu track from 110px */
            gap: 24px;
            min-height: 380px; /* Increased canvas depth from 250px */
        }

        /* Left-side tab navigation grouping */
        .tab-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Enlarged Tab buttons */
        .tab-button {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 22px 14px; /* Generous button padding */
            font-size: 18px; /* Bigger button fonts */
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        /* Tab identity colors matching wireframe styling */
        .tab-button[data-tab="timetable"].active {
            background-color: #fbcfe8;
            border-color: #f472b6;
        }

        .tab-button[data-tab="time"].active {
            background-color: #99f6e4;
            border-color: #2dd4bf;
        }

        .tab-button[data-tab="events"].active {
            background-color: #bfdbfe;
            border-color: #60a5fa;
        }

        /* Enlarged Right-side dynamic display box */
        .content-panel {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 30px; /* Spacious content layout */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Views management (Hidden state) */
        .tab-view {
            display: none;
            height: 100%;
        }

        /* Make active container visible */
        .tab-view.active {
            display: block;
            animation: paneFade 0.25s ease-in-out;
        }

        @keyframes paneFade {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bigger Panels Typography & Forms */
        .tab-view h3 {
            font-size: 22px; /* Increased header size */
            color: #1e293b;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 14px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 16px; /* Bigger input touch targets */
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
            color: #334155;
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: #94a3b8;
        }

        /* Bigger submission button styling */
        .save-btn {
            background-color: #475569;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: auto; /* Pushes the button to the bottom of the card content */
            transition: background 0.15s ease;
        }

        .save-btn:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="schedule-container">
        <!-- Top Title Bar -->
        <div class="schedule-header">Schedule</div>
        
        <div class="schedule-workspace">
            <!-- Left Side Buttons Array -->
            <div class="tab-menu">
                <button class="tab-button active" data-tab="timetable">Timetable</button>
                <button class="tab-button" data-tab="time">Time</button>
                <button class="tab-button" data-tab="events">Events</button>
            </div>

            <!-- Right Side Content Panel Box -->
            <div class="content-panel">
                
                <!-- View Option 1: Timetable block -->
                <div id="view-timetable" class="tab-view active">
                    <h3>Calendar / Timetable of school/work</h3>
                    <div class="input-group">
                        <label>Subject / Class</label>
                        <input type="text" placeholder="e.g., Advanced Mathematics">
                    </div>
                    <div class="input-group">
                        <label>Room No. / Location</label>
                        <input type="text" placeholder="e.g., Auditorium Hall 402">
                    </div>
                    <button class="save-btn">Update Class</button>
                </div>

                <!-- View Option 2: Time records block -->
                <div id="view-time" class="tab-view">
                    <h3>Time record and reminder</h3>
                    <div class="input-group">
                        <label>Set Timer / Reminder</label>
                        <input type="time">
                    </div>
                    <div class="input-group">
                        <label>Task Note</label>
                        <input type="text" placeholder="e.g., Submit project assignment file">
                    </div>
                    <button class="save-btn">Save Timer</button>
                </div>

                <!-- View Option 3: Event block -->
                <div id="view-events" class="tab-view">
                    <h3>Note and reminder</h3>
                    <div class="input-group">
                        <label>Event Name</label>
                        <input type="text" placeholder="e.g., Annual Science Fair Exhibition">
                    </div>
                    <div class="input-group">
                        <label>Event Description / Notes</label>
                        <textarea rows="4" placeholder="Write additional event descriptions or reminders here..."></textarea>
                    </div>
                    <button class="save-btn">Log Event</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Target buttons and target views
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabViews = document.querySelectorAll('.tab-view');

        // Loop through navigation array to setup active listeners
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                
                // 1. Wipe previous button state styling 
                tabButtons.forEach(btn => btn.classList.remove('active'));
                
                // 2. Wipe previous display container views
                tabViews.forEach(view => view.classList.remove('active'));

                // 3. Mark clicked item element active
                button.classList.add('active');

                // 4. Match dataset reference string to active ID pane display window
                const selectedTab = button.getAttribute('data-tab');
                document.getElementById(`view-${selectedTab}`).classList.add('active');
            });
        });
    </script>
</body>
</html>
