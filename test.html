<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic JavaScript Calendar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f7f6;
      margin: 0;
    }
    .calendar-container {
      width: 350px;
      background: #fff;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .calendar-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .calendar-header button {
      background: #007bff;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .calendar-header button:hover {
      background: #0056b3;
    }
    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }
    .weekdays div {
      font-weight: bold;
      color: #666;
      padding-bottom: 10px;
    }
    .days div {
      padding: 10px 0;
      cursor: pointer;
      border-radius: 4px;
    }
    .days div:hover {
      background-color: #e2e6ea;
    }
    .days .today {
      background-color: #ffc107;
      font-weight: bold;
    }
    .days .empty {
      cursor: default;
      background: none !important;
    }
  </style>
</head>
<body>


  <div class="calendar-container">
    <div class="calendar-header">
      <button id="prevBtn">Prev</button>
      <h2 id="monthYear"></h2>
      <button id="nextBtn">Next</button>
    </div>
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="days" id="daysGrid"></div>
  </div>


  <script>
    const monthYearText = document.getElementById("monthYear");
    const daysGrid = document.getElementById("daysGrid");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");


    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];


    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();


    function renderCalendar(month, year) {
      // Clear previous grid entries
      daysGrid.innerHTML = "";


      // Set header text
      monthYearText.innerText = `${months[month]} ${year}`;


      // Get weekday index of the 1st day of the month (0 = Sun, 1 = Mon...)
      const firstDayIndex = new Date(year, month, 1).getDay();


      // Get total number of days in the current month
      const totalDays = new Date(year, month + 1, 0).getDate();


      // Fill preceding padding empty blocks
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement("div");
        emptyDiv.classList.add("empty");
        daysGrid.appendChild(emptyDiv);
      }


      // Generate days of the month
      for (let day = 1; day <= totalDays; day++) {
        const dayDiv = document.createElement("div");
        dayDiv.innerText = day;


        // Highlight current day if it matches actual real-time date
        const today = new Date();
        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          dayDiv.classList.add("today");
        }


        daysGrid.appendChild(dayDiv);
      }
    }


    // Navigation Event Listeners
    prevBtn.addEventListener("click", () => {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar(currentMonth, currentYear);
    });


    nextBtn.addEventListener("click", () => {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar(currentMonth, currentYear);
    });


    // Initial load execution
    renderCalendar(currentMonth, currentYear);
  </script>


</body>
</html>
