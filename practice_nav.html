<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Simple Hamburger Menu</title>
  <style>
    /* Basic Reset & Navbar Layout */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 10px 20px;
      color: white;
      position: relative; /* Keeps the absolute menu positioned correctly */
    }


    /* The Hamburger Icon (Three Lines) */
    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 21px;
      cursor: pointer;
    }
    .hamburger .line {
      height: 3px;
      width: 100%;
      background-color: white;
      border-radius: 2px;
      transition: 0.3s;
    }


    /* Navigation Links Menu */
    .nav-links {
      display: none; /* Hidden by default */
      flex-direction: column;
      width: 100%;
      background-color: #444;
      position: absolute;
      top: 41px; /* Aligns right below the navbar */
      left: 0;
      z-index: 10;
    }
    .nav-links a {
      color: white;
      padding: 15px;
      text-decoration: none;
      text-align: center;
      border-bottom: 1px solid #555;
    }
    .nav-links a:hover {
      background-color: #555;
    }


    /* JavaScript Toggle Class */
    .nav-links.active {
      display: flex; /* Shows menu when button is clicked */
    }
   
    .content {
      padding: 20px;
    }
  </style>
</head>
<body>


  <!-- Navigation Container -->
  <nav class="navbar">
    <div class="logo">MyWebsite</div>
   
    <!-- Hamburger Button -->
    <div class="hamburger" id="hamburgerBtn">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>


    <!-- Menu Items (Connected to actual files) -->
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>


  <!-- Page Content -->
  <div class="content">
    <h1>Welcome to the Home Page</h1>
    <p>Click the hamburger menu to navigate to other pages.</p>
  </div>


  <!-- JavaScript to make the click work -->
  <script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');


    hamburgerBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>


</body>
</html>
