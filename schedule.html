<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Plan Better Life</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
        /* Basic Reset & Navbar Layout */
   body {
     font-family: Arial, sans-serif;
     margin: 0;
   }
   .navbar {
     display: flex;
     justify-content: space-between;
     align-items: center;
     background-color: #8d5f8d;
     padding: 10px 20px;
     color: white;
     position: relative; /* Keeps the absolute menu positioned correctly */
   }




   /* The Hamburger Icon (Three Lines) */
   .hamburger {
     display: flex;
     flex-direction: column;
     justify-content: space-between;
     width: 30px;
     height: 21px;
     cursor: pointer;
   }
   .hamburger .line {
     height: 3px;
     width: 100%;
     background-color: white;
     border-radius: 2px;
     transition: 0.3s;
   }




   /* Navigation Links Menu */
   .nav-links {
     display: none; /* Hidden by default */
     flex-direction: column;
     width: 100%;
     background-color: #8d5f8d;
     position: absolute;
     top: 41px; /* Aligns right below the navbar */
     left: 0;
     z-index: 10;
   }
   .nav-links a {
     color: white;
     padding: 15px;
     text-decoration: none;
     text-align: center;
     border-bottom: 1px solid #555;
   }
   .nav-links a:hover {
     background-color: #555;
   }


   /* JavaScript Toggle Class */
   .nav-links.active {
     display: flex; /* Shows menu when button is clicked */
   }
 
   .content {
     padding: 20px;
   }
   /* Image adjust for images inside the boxes sectiona */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f3f4f6;
        padding: 40px;
    }

    .schedule-container {
        width: 750px;
        background-color: #f3e8ff; 
        border: 3px solid #c084fc;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .schedule-header {
        background-color: #fde047; 
        border: 3px solid #eab308;
        border-radius: 8px;
        padding: 18px;
        text-align: center;
        font-weight: bold;
        font-size: 24px;
        color: #334155;
        margin-bottom: 24px;
    }

    .schedule-workspace {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 24px;
        min-height: 380px;
    }

    .tab-menu {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .tab-button {
        background-color: #ffffff;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        padding: 22px 14px;
        font-size: 18px;
        font-weight: 600;
        color: #334155;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s ease;
    }

    .tab-button[data-tab="timetable"].active { background-color: #fbcfe8; border-color: #f472b6; }
    .tab-button[data-tab="time"].active { background-color: #99f6e4; border-color: #2dd4bf; }
    .tab-button[data-tab="events"].active { background-color: #bfdbfe; border-color: #60a5fa; }

    .content-panel {
        background-color: #ffffff;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        padding: 30px;
        display: flex;
        flex-direction: column;
    }

    .tab-view { display: none; height: 100%; }
    .tab-view.active { display: block; animation: paneFade 0.25s ease-in-out; }

    @keyframes paneFade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .tab-view h3 { font-size: 22px; color: #1e293b; margin-bottom: 20px; }
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .input-group label { font-size: 14px; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .input-group input, .input-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 6px;
        font-size: 16px;
        color: #334155;
    }

    .save-btn {
        background-color: #475569;
        color: white;
        border: none;
        padding: 14px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        margin-top: auto;
    }
    .save-btn:hover { background-color: #1e293b; }

    
</style>
</head>

      <!--Nav button for hamburger menu-->
 <nav class="navbar">
   <div class="logo"></div>
 
   <!-- Hamburger Button -->
   <div class="hamburger" id="hamburgerBtn">
     <div class="line"></div>
     <div class="line"></div>
     <div class="line"></div>
   </div>




   <!-- Menu Items (Connected to actual files) -->
   <div class="nav-links" id="navLinks">
     <a href="index.html">Home</a>
     <a href="schedule.html">Schedule</a>
     <a href="time.html">Time</a>
     <a href="record.html">Record</a>
   </div>
 </nav>


 <!-- JavaScript to make the click work (nav) -->
 <script>
   const hamburgerBtn = document.getElementById('hamburgerBtn');
   const navLinks = document.getElementById('navLinks');




   hamburgerBtn.addEventListener('click', () => {
     navLinks.classList.toggle('active');
   });
 </script>




<body>
    <div class="schedule-container">
        <div class="schedule-header">Good Plan Better Life</div>
        
        <div class="schedule-workspace">
            <div class="tab-menu">
                <button class="tab-button active" data-tab="timetable">Timetable</button>
                <button class="tab-button" data-tab="time">Time</button>
                <button class="tab-button" data-tab="events">Events</button>
            </div>

            <div class="content-panel">
                <div id="view-timetable" class="tab-view active">
                    <h3>Calendar / Timetable of school/work</h3>
                    <div class="input-group">
                        <label>Subject / Class</label>
                        <input type="text" id="subjectInput" placeholder="e.g., Advanced Mathematics">
                    </div>
                    <div class="input-group">
                        <label>Room No. / Location</label>
                        <input type="text" id="roomInput" placeholder="e.g., Auditorium Hall 402">
                    </div>
                    <button class="save-btn" onclick="sendToBackend('timetable')">Update Class</button>
                </div>

                <div id="view-time" class="tab-view">
                    <h3>Time Record & Reminder</h3>
                    <div class="input-group">
                        <label>Set Timer / Reminder Time</label>
                        <input type="time" id="timerInput">
                    </div>
                    <div class="input-group">
                        <label>Task Note</label>
                        <input type="text" id="taskInput" placeholder="e.g., Submit project assignment file">
                    </div>
                    <button class="save-btn" onclick="sendToBackend('time')">Save Timer</button>
                </div>

                <div id="view-events" class="tab-view">
                    <h3>Note and Reminder</h3>
                    <div class="input-group">
                        <label>Event Name</label>
                        <input type="text" id="eventNameInput" placeholder="e.g., Annual Science Fair Exhibition">
                    </div>
                    <div class="input-group">
                        <label>Event Description / Notes</label>
                        <textarea id="eventDescInput" rows="4" placeholder="Write additional event descriptions or reminders here..."></textarea>
                    </div>
                    <button class="save-btn" onclick="sendToBackend('events')">Log Event</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store scheduled reminders locally for notification checking
        const activeReminders = [];

        // Request Desktop Notification Permissions on load
        window.addEventListener('load', () => {
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }
            }
        });

        // Tab Switching Logic
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabViews = document.querySelectorAll('.tab-view');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabViews.forEach(view => view.classList.remove('active'));

                button.classList.add('active');
                const selectedTab = button.getAttribute('data-tab');
                document.getElementById(`view-${selectedTab}`).classList.add('active');
            });
        });

        // Send Data to Python Flask Backend
        async function sendToBackend(category) {
            let payload = { category: category };

            if (category === 'timetable') {
                payload.subject = document.getElementById('subjectInput').value;
                payload.room = document.getElementById('roomInput').value;
            } else if (category === 'time') {
                payload.time = document.getElementById('timerInput').value;
                payload.task = document.getElementById('taskInput').value;

                // Add to active notifications array if a time was selected
                if (payload.time) {
                    activeReminders.push({
                        time: payload.time,
                        task: payload.task || 'Reminder Task',
                        triggered: false
                    });
                }
            } else if (category === 'events') {
                payload.eventName = document.getElementById('eventNameInput').value;
                payload.eventDesc = document.getElementById('eventDescInput').value;
            }

            try {
                const response = await fetch('http://127.0.0.1:5000/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    Swal.fire({
                        title: 'Saved!',
                        text: result.message,
                        icon: 'success',
                        confirmButtonColor: '#8d5f8d'
                    });
                }
            } catch (error) {
                Swal.fire('Error', 'Could not connect to backend server (popoutbox.py).', 'error');
            }
        }

        // Notification Checker (Runs every 5 seconds)
        setInterval(() => {
            const now = new Date();
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHours}:${currentMinutes}`;

            activeReminders.forEach(reminder => {
                if (reminder.time === currentTimeStr && !reminder.triggered) {
                    reminder.triggered = true; // Avoid repeating alert in the same minute

                    // Send Mac/Browser Notification
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("🔔 Reminder Alert!", {
                            body: reminder.task,
                            icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
                        });
                    } else {
                        // Fallback alert if notifications are disabled
                        Swal.fire('🔔 Reminder Alert!', reminder.task, 'info');
                    }
                }
            });
        }, 5000);
    </script>
</body>
</html>
