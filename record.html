   <script>
       // Target buttons and target views
       const tabButtons = document.querySelectorAll('.tab-button');
       const tabViews = document.querySelectorAll('.tab-view');


       // Loop through navigation array to setup active listeners
       tabButtons.forEach(button => {
           button.addEventListener('click', () => {
              
               // 1. Wipe previous button state styling
               tabButtons.forEach(btn => btn.classList.remove('active'));
              
               // 2. Wipe previous display container views
               tabViews.forEach(view => view.classList.remove('active'));


               // 3. Mark clicked item element active
               button.classList.add('active');


               // 4. Match dataset reference string to active ID pane display window
               const selectedTab = button.getAttribute('data-tab');
               document.getElementById(`view-${selectedTab}`).classList.add('active');
           });
       });


let timeout;


window.addEventListener("scroll", () => {
   clearTimeout(timeout);
   timeout = setTimeout(() => {
       // FIXED: Corrected the quotation marks and separated the key and value
       localStorage.setItem("scrollY", window.scrollY);
   }, 200);
});


// FIXED: Corrected the arrow function syntax ()> to () =>
window.addEventListener("load", () => {
   // FIXED: Changed scrollY to savedY in the if-statement to check the retrieved value
   const savedY = localStorage.getItem("scrollY");
   if (savedY !== null) {
       // FIXED: Corrected window.scrollTp to window.scrollTo
       window.scrollTo(0, parseInt(savedY));
   }
});
   </script>


   <script>
       async function saveData() {
           const inputElement = document.getElementById('messageInput');
           const messageValue = inputElement.value;


           if (!messageValue) {
               Swal.fire('Oops!', 'Please type something first.', 'warning');
               return;
           }


           try {
               // Send data seamlessly to the Python API endpoint
               const response = await fetch('/api/save', {
                   method: 'POST',
                   headers: { 'Content-Type': 'application/json' },
                   body: JSON.stringify({ text_content: messageValue })
               });


               const result = await response.json();


               if (result.status === 'success') {
                   // Show the clean success pop-out box
                   Swal.fire({
                       title: 'Success!',
                       text: 'Successfully saved!',
                       icon: 'success',
                       confirmButtonColor: '#28a745'
                   });
                   // Clear out the input field for the next entry
                   inputElement.value = '';
               }
           } catch (error) {
               Swal.fire('Error', 'Could not reach the server.', 'error');
           }
       }
   </script>
