<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Plan Better Life - Weekly Planner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      background: #f5f5f5;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #8d5f8d;
      padding: 10px 20px;
      color: white;
      position: relative;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 21px;
      cursor: pointer;
    }

    .hamburger .line {
      height: 3px;
      width: 100%;
      background-color: white;
      border-radius: 2px;
    }

    .nav-links {
      display: none;
      flex-direction: column;
      width: 100%;
      background-color: #8d5f8d;
      position: absolute;
      top: 41px;
      left: 0;
      z-index: 10;
    }

    .nav-links a {
      color: white;
      padding: 15px;
      text-decoration: none;
      text-align: center;
      border-bottom: 1px solid #555;
    }

    .nav-links.active {
      display: flex;
    }

    h1 {
      color: #444;
      margin-top: 20px;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid black;
      width: 140px;
      height: 40px;
    }

    th {
      background: pink;
    }

    input {
      width: 95%;
      height: 80%;
      border: none;
      text-align: center;
      background: transparent;
      font-size: 0.95rem;
    }

    input:focus {
      outline: 1px solid #8d5f8d;
      background: #fff;
    }

    .time-input {
      font-weight: bold;
    }

    #saveBtn {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #8d5f8d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    #saveBtn:hover {
      background-color: #724872;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo"></div>
    <div class="hamburger" id="hamburgerBtn">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>

    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="schedule.html">Schedule</a>
      <a href="time.html">Time</a>
      <a href="record.html">Record</a>
    </div>
  </nav>

  <h1>Good Plan Better Life Weekly Planner</h1>

  <table id="timetable">
    <thead>
      <tr>
        <th>Time</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <button id="saveBtn">Save Schedule</button>

  <script>
    // 1. Navigation Hamburger Toggle
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');

    hamburgerBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });

    // 2. Dynamically Generate Table Rows with Editable Time & Day Inputs
    const tableBody = document.getElementById("tableBody");

    for (let hour = 8; hour <= 17; hour++) {
      let row = tableBody.insertRow();

      // Time Column (Editable)
      let timeCell = row.insertCell();
      let timeInput = document.createElement("input");
      timeInput.type = "text";
      timeInput.value = `${hour}:00`;
      timeInput.className = "time-input";
      timeCell.appendChild(timeInput);

      // Days 1 to 5 Columns (Monday - Friday)
      for (let day = 1; day <= 5; day++) {
        let cell = row.insertCell();
        let input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Type here";
        cell.appendChild(input);
      }
    }

    // 3. Automatically Load Saved Data When Page Opens or User Navigates Back
    window.addEventListener("DOMContentLoaded", loadSchedule);

    function loadSchedule() {
      const savedSchedule = JSON.parse(localStorage.getItem("user_schedule"));

      if (savedSchedule && savedSchedule.length > 0) {
        const rows = tableBody.rows;

        savedSchedule.forEach(item => {
          if (rows[item.rowIndex]) {
            // Restore custom time slot
            const timeInput = rows[item.rowIndex].cells[0].querySelector("input");
            if (timeInput && item.time) timeInput.value = item.time;

            // Restore day task
            const taskInput = rows[item.rowIndex].cells[item.dayIndex].querySelector("input");
            if (taskInput && item.task !== undefined) taskInput.value = item.task;
          }
        });
      }

      // Restore scroll position
      const savedY = localStorage.getItem("scrollY");
      if (savedY !== null) {
        window.scrollTo(0, parseInt(savedY));
      }
    }

    // 4. Save Function
    document.getElementById("saveBtn").addEventListener("click", saveSchedule);

    function saveSchedule() {
      let schedule = [];
      let rows = tableBody.rows;

      for (let i = 0; i < rows.length; i++) {
        let timeVal = rows[i].cells[0].querySelector("input").value;

        for (let j = 1; j <= 5; j++) {
          let taskVal = rows[i].cells[j].querySelector("input").value;

          schedule.push({
            rowIndex: i,
            dayIndex: j,
            time: timeVal,
            task: taskVal
          });
        }
      }

      // Save to browser memory so it stays when navigating pages
      localStorage.setItem("user_schedule", JSON.stringify(schedule));

      alert("Schedule Saved Successfully!");

      // Optional: Send data to Python backend
      sendDataToPython(schedule);
    }

    // 5. Python API Sender (Failsafe)
    async function sendDataToPython(scheduleData) {
      try {
        await fetch('http://localhost:5000/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ schedule: scheduleData })
        });
      } catch (err) {
        console.log("Local Python server offline; saved locally in browser.");
      }
    }

    // 6. Save Scroll Position
    let timeout;
    window.addEventListener("scroll", () => {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        localStorage.setItem("scrollY", window.scrollY);
      }, 200);
    });
  </script>
</body>
</html>
