<!DOCTYPE html>
<ahtml lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Plan Better Life</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    padding:30px;
}


.container{
    width:90%;
    max-width:1200px;
    min-height:90vh;
    margin:auto;
    background:#ead8ee;
    border:2px solid #8d5f8d;
    border-radius:10px;
    padding:20px;
}


.header{
    background:white;
    border:2px solid #666;
    border-radius:6px;
    height:140px;


    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;


    margin-bottom:20px;
}


.header h1{
    color:#555;
}


.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:20px;
}


.box{
    height:140px;
    border-radius:6px;
    border:2px solid #666;


    display:flex;
    justify-content:center;
    align-items:center;


    text-decoration:none;
    color:#333;
    font-size:24px;
    font-weight:bold;


    transition:0.3s;
}


.box:hover{
    transform:scale(1.05);
}


.time{
    background:#ea7bcc;
}


.schedule{
    background:#f4dd45;
}


.record{
    background:#6ea4e8;
}


.bottom{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}


.image-box{
    height:180px;
    border:2px solid #666;
    border-radius:6px;
    background:#ecd3a4;


    display:flex;
    justify-content:center;
    align-items:center;


    font-size:22px;
    color:#555;
}


 /* Basic Reset & Navbar Layout */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #8d5f8d;
      padding: 10px 20px;
      color: white;
      position: relative; /* Keeps the absolute menu positioned correctly */
    }


    /* The Hamburger Icon (Three Lines) */
    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 21px;
      cursor: pointer;
    }
    .hamburger .line {
      height: 3px;
      width: 100%;
      background-color: white;
      border-radius: 2px;
      transition: 0.3s;
    }


    /* Navigation Links Menu */
    .nav-links {
      display: none; /* Hidden by default */
      flex-direction: column;
      width: 100%;
      background-color: #8d5f8d;
      position: absolute;
      top: 41px; /* Aligns right below the navbar */
      left: 0;
      z-index: 10;
    }
    .nav-links a {
      color: white;
      padding: 15px;
      text-decoration: none;
      text-align: center;
      border-bottom: 1px solid #555;
    }
    .nav-links a:hover {
      background-color: #555;
    }


    /* JavaScript Toggle Class */
    .nav-links.active {
      display: flex; /* Shows menu when button is clicked */
    }
   
    .content {
      padding: 20px;
    }
    /* Image adjust for images inside the boxes sectiona */
   


</style>
</head>


  <nav class="navbar">
    <div class="logo"></div>
   
    <!-- Hamburger Button -->
    <div class="hamburger" id="hamburgerBtn">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>


    <!-- Menu Items (Connected to actual files) -->
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="schedule.html">Schedule</a>
      <a href="time.html">Time</a>
      <a href="record.html">Record</a>
    </div>
  </nav>




  <!-- JavaScript to make the click work -->
  <script>
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');


    hamburgerBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>


</body>
</html>




<div class="container">


    <div class="header">
        <h1>
            <p style="font-family:verdana"></p>Good Plan Better Life</p>
        </h1>
    </div>


    <div class="menu">
        <a href="time.html" class="box time">Time</a>
        <a href="schedule.html" class="box schedule">Schedule</a>
        <a href="record.html" class="box record">Record</a>
    </div>


    <div class="bottom">
        <div class="image-box"><img src="capture.jpg" alt="Description of the image"></div>
        <div class="image-box"><img src="blue_sea.jpg" alt="Description of the image"></div>
    </div>


</div>


</body>
</html>
