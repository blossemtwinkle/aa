<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Timetable</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.timetable-outer-box {
    background-color: #f0d5f2;
    border: 2px solid #555;
    border-radius: 12px;
    padding: 20px;
    width: 95%;
    max-width: 1100px;
}

.time-header {
    background-color: #ff80bf;
    text-align: center;
    font-weight: bold;
    font-size: 1.3rem;
    padding: 16px;
    border: 1.5px solid #333;
    border-radius: 8px;
    margin-bottom: 20px;
}

.days-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    align-items: start;
}

.day-column {
    border: 1.5px solid #333;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Background Colors */
.mon { background-color: #ffd6d6; }
.tue { background-color: #ffe3c2; }
.wed { background-color: #ffffc2; }
.thu { background-color: #d1f7d1; }
.fri { background-color: #d1e8ff; }

.day-column h3 { text-align: center; margin: 0; }

.item-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Sub-card box styling for individual meetings/classes */
.schedule-item {
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid #777;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.schedule-item input {
    width: 90%;
    padding: 5px;
    font-size: 0.8rem;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.add-btn {
    background-color: #333;
    color: white;
    border: none;
    padding: 6px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.8rem;
}

.delete-btn {
    background-color: #ff4d4d;
    color: white;
    border: none;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.75rem;
    align-self: flex-end;
}

.controls {
    margin-top: 20px;
    text-align: center;
}

.save-btn {
    background-color: #4CAF50;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    padding: 10px 25px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

#alert-box {
    display: none;
    margin-top: 10px;
    padding: 10px;
    background-color: #d4edda;
    color: #155724;
    border-radius: 6px;
    font-weight: bold;
}
    </style>
</head>
<body>

    <div class="timetable-outer-box">
        <div class="time-header">Time / Date Schedule</div>

        <div class="days-container">
            
            <div class="day-column mon">
                <h3>Mon</h3>
                <div id="mon-list" class="item-container"></div>
                <button class="add-btn" onclick="addScheduleBox('mon')">+ Add Class / Meeting</button>
            </div>

            <div class="day-column tue">
                <h3>Tue</h3>
                <div id="tue-list" class="item-container"></div>
                <button class="add-btn" onclick="addScheduleBox('tue')">+ Add Class / Meeting</button>
            </div>

            <div class="day-column wed">
                <h3>Wed</h3>
                <div id="wed-list" class="item-container"></div>
                <button class="add-btn" onclick="addScheduleBox('wed')">+ Add Class / Meeting</button>
            </div>

            <div class="day-column thu">
                <h3>Thu</h3>
                <div id="thu-list" class="item-container"></div>
                <button class="add-btn" onclick="addScheduleBox('thu')">+ Add Class / Meeting</button>
            </div>

            <div class="day-column fri">
                <h3>Fri</h3>
                <div id="fri-list" class="item-container"></div>
                <button class="add-btn" onclick="addScheduleBox('fri')">+ Add Class / Meeting</button>
            </div>

        </div>

        <div class="controls">
            <button class="save-btn" onclick="saveSchedule()">Save Schedule</button>
            <div id="alert-box"></div>
        </div>
    </div>

<script>
    // Function to dynamically add a new schedule box into a day column
function addScheduleBox(dayId, itemData = { subject: '', time: '', dueDate: '' }) {
    const container = document.getElementById(`${dayId}-list`);

    // Create a new schedule entry wrapper
    const entryCard = document.createElement('div');
    entryCard.className = 'schedule-item';

    entryCard.innerHTML = `
        <input type="text" class="item-subject" placeholder="Subject / Class" value="${itemData.subject || ''}">
        <input type="text" class="item-time" placeholder="Time / Finish" value="${itemData.time || ''}">
        <input type="text" class="item-due" placeholder="Due Date" value="${itemData.dueDate || ''}">
        <button class="delete-btn" onclick="this.parentElement.remove()">✕ Remove</button>
    `;

    container.appendChild(entryCard);
}

// 1. Fetch saved schedule from Python when the page loads or refreshes
function loadSchedule() {
    fetch('http://127.0.0.1:5000/api/data', {
        method: 'GET'
    })
    .then(response => response.json())
    .then(response => {
        const data = response.value;
        const days = ['mon', 'tue', 'wed', 'thu', 'fri'];

        days.forEach(day => {
            const container = document.getElementById(`${day}-list`);
            container.innerHTML = ''; // Clear default items

            if (data[day] && data[day].length > 0) {
                // Populate saved items from Python
                data[day].forEach(item => addScheduleBox(day, item));
            } else {
                // If no saved items for this day, show 1 empty box by default
                addScheduleBox(day);
            }
        });
    })
    .catch(error => {
        console.error('Error loading schedule:', error);
    });
}

// 2. Save current schedule to Python server
function saveSchedule() {
    const days = ['mon', 'tue', 'wed', 'thu', 'fri'];
    const timetableData = {};

    days.forEach(day => {
        timetableData[day] = [];
        const dayContainer = document.getElementById(`${day}-list`);
        const items = dayContainer.getElementsByClassName('schedule-item');

        Array.from(items).forEach(item => {
            timetableData[day].push({
                subject: item.querySelector('.item-subject').value,
                time: item.querySelector('.item-time').value,
                dueDate: item.querySelector('.item-due').value
            });
        });
    });

    fetch('http://127.0.0.1:5000/api/data', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ value: timetableData })
    })
    .then(response => response.json())
    .then(data => {
        const alertBox = document.getElementById('alert-box');
        alertBox.innerText = "Successfully saved! Reloading the page will keep your data.";
        alertBox.style.display = 'block';

        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 3000);
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Could not connect to Python Flask server!');
    });
}

// Automatically fetch data when page loads
window.onload = loadSchedule;
</script>

    <script src="script.js"></script>
</body>
</html>
